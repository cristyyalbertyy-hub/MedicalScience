<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <title>Studio9 Medical Science</title>
    <meta name="theme-color" content="#1F4E6B" />
    <link rel="icon" type="image/png" href="/StudioNine.png" />
    <link rel="stylesheet" href="/apps/launcher.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-bar">
        <a class="app-bar__brand" href="/packages/">
          <img src="/StudioNine.png" alt="" width="28" height="28" />
          <span id="app-brand-label">Studio9 Medical Science</span>
        </a>
        <a class="app-bar__back" href="/packages/">← All disciplines</a>
      </header>
      <div class="app-frame-wrap">
        <p class="app-loading" id="app-loading">Loading module…</p>
        <p class="app-error" id="app-error" hidden></p>
        <iframe
          id="app-frame"
          class="app-frame"
          title="Studio9 learning module"
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
          allow="fullscreen"
          hidden
        ></iframe>
      </div>
    </div>
    <script type="module" src="/apps/launcher.js"></script>
  </body>
</html>
