<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/genetics/favicon.svg" />
  <title>Medical Genetics</title>
  <link rel="stylesheet" href="/genetics/styles.css" />
</head>
<body>
  <div id="auth-gate" class="auth-layout" hidden></div>

  <div id="app-shell" class="app-shell is-mobile-menu" hidden>
    <header class="app-header" id="app-header">
      <button type="button" class="home-overview-btn" id="homeBtn" aria-label="Back to course overview">
        <span class="home-overview-btn__media">
          <img src="" alt="" />
          <span class="home-overview-btn__fallback" aria-hidden>⊕</span>
        </span>
        <span class="home-overview-btn__label">Course overview</span>
      </button>
      <h1>Medical Genetics</h1>
    </header>

    <div class="mobile-lesson-bar" id="mobileBar" hidden>
      <button type="button" class="mobile-menu-back" id="mobileMenuBack">← Menu</button>
      <div class="mobile-lesson-bar__text">
        <span class="mobile-lesson-bar__chapter" id="mobileChapter"></span>
        <span class="mobile-lesson-bar__sub" id="mobileSub"></span>
      </div>
    </div>

    <div class="layout">
      <div class="sidebar-column">
        <nav class="tree-panel" id="tree-nav" aria-label="Chapters and topics"></nav>
      </div>

      <div class="content-panel" id="content-panel">
        <nav class="resources" id="resource-nav" aria-label="Resource type" hidden></nav>
        <section id="viewer" class="viewer" aria-live="polite"></section>
      </div>
    </div>
  </div>

  <script src="/genetics/config.public.js"></script>
  <script type="module" src="/genetics/bundle.js"></script>
<script>(function(){window.setTimeout(function(){var shell=document.getElementById('app-shell');var gate=document.getElementById('auth-gate');var loaded=(shell&&!shell.hidden)||(gate&&!gate.hidden&&gate.childElementCount);if(!loaded){document.body.innerHTML='<div style="font-family:system-ui,sans-serif;max-width:32rem;margin:3rem auto;padding:0 1.25rem;color:#14213d;line-height:1.5"><h1 style="font-size:1.25rem;margin:0 0 0.75rem">Medical Genetics</h1><p style="margin:0 0 0.75rem">The app did not load. Usually an outdated cached file in your browser.</p><p style="margin:0"><strong>Try:</strong> hard refresh (Ctrl+Shift+R) or open in a private window.</p></div>';}},4500);})();</script></body>
</html>
